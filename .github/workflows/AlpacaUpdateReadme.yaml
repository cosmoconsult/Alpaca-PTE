name: "COSMO Alpaca - Update README"

on:
  workflow_dispatch:
    inputs:
      directCommit:
        description: Direct Commit?
        type: boolean
        default: false
      useGhTokenWorkflow:
        description: Use GhTokenWorkflow for PR/Commit?
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  id-token: write
  pull-requests: write

defaults:
  run:
    shell: pwsh

env:
  WorkflowEventName: ${{ github.event_name }} # set to workflow_call if workflow_call trigger is added
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  UpdateReadme:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Initialize the workflow
      id: init
      uses: microsoft/AL-Go-Actions/WorkflowInitialize@v9.0
      with:
        shell: pwsh

    - name: Read settings
      uses: microsoft/AL-Go-Actions/ReadSettings@v9.0
      with:
        shell: pwsh
        get: commitOptions

    - name: Read secrets
      id: ReadSecrets
      uses: microsoft/AL-Go-Actions/ReadSecrets@v9.0
      with:
        shell: pwsh
        gitHubSecrets: ${{ toJson(secrets) }}
        getSecrets: 'TokenForPush'
        useGhTokenWorkflowForPush: '${{ github.event.inputs.useGhTokenWorkflow }}'

    - name: Calculate Commit Options
      env:
        directCommit: '${{ inputs.directCommit }}'
        workflowEventName: ${{ env.WorkflowEventName }}
      run: |
        $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
        if($env:workflowEventName -in 'workflow_dispatch', 'workflow_call') {
          Write-Host "Using inputs from $($env:workflowEventName) event"
          $directCommit = $env:directCommit
        }
        else {
          Write-Host "Using inputs from commitOptions setting"
          $commitOptions = $env:commitOptions | ConvertFrom-Json # Available from ReadSettings step
          $directCommit=$(-not $commitOptions.createPullRequest)
        }
        Add-Content -Encoding UTF8 -Path $env:GITHUB_ENV -Value "directCommit=$directCommit"

    - name: Update README
      uses: cosmoconsult/Alpaca-Actions/Actions/UpdateReadme@staging/copilot/al-go-pr-compiler-warnings
      with:
        shell: pwsh
        token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
        directCommit: ${{ github.event.inputs.directCommit }}
